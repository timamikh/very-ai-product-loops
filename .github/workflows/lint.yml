name: lint

# The wiring & enum linter is the framework's guard against silent drift (produces <-> section ids
# <-> step README <-> library index <-> questions.yaml; adapter reads_ids; register enums; csv ⊆ md;
# the relative-path link canon). It runs on every push and PR so a desync can't merge unnoticed.
# Private instances live under instances/ (gitignored) and are never present here — the linter checks
# the framework and the committed examples only.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run the wiring/enum linter (tracked instances only — the tree this checkout holds)
        run: python3 tools/lint.py --ci
      - name: Smoke-test the shared read layer (tools/loops)
        run: python3 tools/loops/selftest.py
      - name: Regression-test the linter on the defect fixture (tools/tests)
        run: python3 tools/tests/test_lint.py
