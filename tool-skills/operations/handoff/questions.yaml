# handoff — interview to gather what the agent cannot observe itself.
# The agent fills most of HANDOFF.md from the instance; these questions cover the rest.
tool: handoff
writes: [file:HANDOFF.md]
questions:
  - id: restart-reason
    ask: "Why is the handoff needed now (restart / end of session / transfer / other)?"
    type: single_select
    options: [restart, end-of-session, transfer, other]
  - id: env-changes
    ask: "Did anything change in the environment I can't see — installed extensions, issued tokens, new accounts/profiles, permissions?"
    type: free_text
    why: "The agent cannot observe environment changes made outside its session."
  - id: pending-decisions
    ask: "Any decisions you've made since the artifacts were last updated (so the next agent doesn't re-ask)?"
    type: list
    why: "Keeps decided forks from being re-opened by the receiving agent."
  - id: human-todo
    ask: "Is there anything YOU need to do across the restart (install, login, approve)? I'll list it as the human's step."
    type: free_text
    why: "Surfaces the human's step so the next agent knows what to wait for."
