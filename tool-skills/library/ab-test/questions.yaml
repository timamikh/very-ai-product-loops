# ab-test — interview
tool: ab-test
questions:
  - id: hypothesis
    ask: "Which H-… does this experiment test, and against which metric node (M-…)? (if it has no threshold yet, run hypothesis-test-design first)"
    type: free_text
  - id: oec
    ask: "What is the OEC — the single primary metric the decision hangs on? (one M-…, not three co-equal metrics)"
    type: free_text
    why: "More than one primary metric means the verdict gets negotiated after the fact."
  - id: guardrails
    ask: "Which guardrail metrics must NOT drop while chasing the OEC? (latency, error rate, churn, revenue-per-user…) and their red lines"
    type: list
    why: "Winning the OEC while breaking latency or churn is a loss, not a win."
  - id: randomization
    ask: "What is the randomization unit (user/account/session) and the arms + split? (the unit must match the metric's grain and avoid spillover)"
    type: free_text
  - id: sizing
    ask: "Baseline rate, minimum detectable effect (MDE), power/α → required sample per arm and run length. Can you actually reach it?"
    type: free_text
    why: "An underpowered test is an inconclusive dressed up as a null."
  - id: stopping_rule
    ask: "What's the stopping rule, fixed in advance — a set horizon or a valid sequential method? (no peek-and-stop)"
    type: free_text
    why: "Stopping the moment it looks significant inflates false positives."
  - id: pitfalls
    ask: "Which pitfall checks will you run before trusting the read — SRM, novelty/primacy, cross-arm spillover, segment interactions?"
    type: list
