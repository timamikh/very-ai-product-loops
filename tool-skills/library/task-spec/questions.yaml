# task-spec — interview (back-office direction)
tool: task-spec
writes: [section:must, section:backlog]
questions:
  - id: feature_row
    ask: "Which F-… register row does this item advance? (Check registers/features.md first — pick up an existing planned row; a new candidate mints one: direction, surface S-…, serves.)"
    type: free_text
    why: "The item is sprint-local; the F-… is its cross-sprint identity — without it the backlog dies with the sprint."
  - id: expected_impact
    ask: "Pre-registered expected impact: which M-… (baseline → expected, from metrics.csv) / R-… / H-…, and the check-by when it becomes readable?"
    type: free_text
    why: "Read at the next Step-5 gate by impact-readout; an expectation set after the numbers land is a negotiation, not a read."
  - id: estimate_class
    ask: "Estimate: size class S/M/L + a range?"
    type: free_text
    why: "[assumption] until the readout records the actual; misses calibrate the sizing."
  - id: description
    ask: "What needs doing? (one clear description, at task altitude — not sub-tasks)"
    type: free_text
  - id: why
    ask: "Why does the business need it — which M-… does it move, R-… does it mitigate, or H-… does it serve?"
    type: free_text
    why: "A task with no link moves nothing, mitigates nothing, tests nothing — a candidate to cut."
  - id: dod
    ask: "The binary Definition of Done — answerable yes/no at sprint end?"
    type: free_text
    why: "A DoD you can't answer yes/no to never closes and never fails."
  - id: owner
    ask: "Who owns it landing? (a named person, not 'the team')"
    type: free_text
  - id: estimate
    ask: "What's the estimate — the capacity it consumes?"
    type: free_text
