# risk-mitigation — interview
tool: risk-mitigation
questions:
  - id: carried_risks
    ask: "Which R-… are marked carried in the register? (⚙️ agent pulls them — surfacing/triage happened in pre-mortem / niche-risks, not here)"
    type: list
  - id: mitigation
    ask: "For each carried risk — what will we actually do about it? (an action, not 'monitor closely')"
    type: per_item
    why: "A mitigation with no action is theatre."
  - id: owner
    ask: "For each carried risk — who is the one person that acts when the trigger fires?"
    type: per_item
    why: "A committee is not an owner; a risk with no owner is not managed."
  - id: trigger_due
    ask: "For each carried risk — what observable signal says 'act now' (trigger), and on what date is the mitigation reviewed even if the trigger never fires (due)?"
    type: per_item
    why: "A trigger without a review date rots silently; a date without a trigger acts too late."
