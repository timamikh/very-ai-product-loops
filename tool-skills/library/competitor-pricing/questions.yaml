# competitor-pricing — interview
tool: competitor-pricing
questions:
  - id: reference_config
    ask: "The lead segment's typical account — how many seats, how much usage per month? (⚙️ agent proposes from segments; every competitor's price is expressed per month at this configuration)"
    type: free_text
    why: "Unlike plans become comparable only at one named configuration."
  - id: pricing
    ask: "For each detailed-table competitor — do you know their pricing, or should the agent scan sites/search for it?"
    type: per_item
    options: [i-provide, agent-scans, unknown]
  - id: comparability
    ask: "Which price should anchor our comparison (the plan closest to our intended packaging)?"
    type: free_text
    why: "A per-seat and a usage price are not commensurable; the anchor must be named."
