# retention-analysis — intake: only what a human knows
# The curve, the splits, the loop and the drivers are read from source:metrics / register:metrics,
# never asked.
tool: retention-analysis
questions:
  - id: active_definition
    ask: "What counts as a retained ACTIVE action (the value action, not a login), and which activation event starts a member's clock?"
    type: free_text
    why: "The curve is meaningless without a crisp 'active'; a vanity 'active' makes the tree steer by opens."
  - id: cohort_period
    ask: "What join period does the business think in for cohorts — daily, weekly or monthly?"
    type: single_select
    options: [daily, weekly, monthly]
    why: "A monthly-value product judged on daily retention lies; the period fixes the cadence every cell is read on."
