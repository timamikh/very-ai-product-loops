# value-definition — interview
# Drives an LLM survey OR renders to a fillable file. Each question offers 2–4 options with a
# ⚙️ default the agent proposes; the human confirms or overrides. Free-text always allowed.
tool: value-definition
produces: value-defensibility

questions:
  - id: core_value
    ask: "In one line — what is valuable here that a clone rebuilt with an LLM tomorrow would NOT have?"
    type: free_text
    why: "Forces value onto position, not features."

  - id: base_moats
    ask: "Which base moats do you actually have or can build? (select all that apply)"
    type: multi_select
    options:
      - unique data
      - unique algorithms / IP
      - exclusive access / integrations / rights
      - audience / distribution
      - brand / trust
      - expertise
      - processes (speed & precision)
      - product complexity / depth
    default: []   # ⚙️ agent pre-selects from concept/segments, marks each [assumption]

  - id: moat_state
    ask: "For each selected moat — do you HAVE it, are you BUILDING it, or is it an ASPIRATION?"
    type: per_item
    options: [have, building, aspiration]
    why: "Have/building can be [sourced]; aspiration stays [assumption]."

  - id: llm_test
    ask: "For each moat — would it survive someone rebuilding the app with an LLM? (yes / partly / no)"
    type: per_item
    options: [yes, partly, "no"]
    why: "A 'no' means it's a feature, not a moat."

  - id: derivatives
    ask: "Any derivative moats in reach (lock-in, network effects, scale)? Name what each depends on."
    type: free_text
    when: "step == 3 or customers_exist"
    why: "Derivatives need a customer or scale; don't claim them at concept stage."

  - id: lead_moat
    ask: "Which single moat do you bet on leading with?"
    type: single_select_from: base_moats
    default: null  # ⚙️ agent proposes the most durable + highest-confidence one
    why: "The lead moat shapes strategy."
