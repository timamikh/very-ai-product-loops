# segment-pains — interview
tool: segment-pains
questions:
  - id: job
    ask: "For the lead segment — what are they really trying to get done (the job)?"
    type: free_text
    why: "Pains are obstacles to the job, not generic complaints."
  - id: pains
    ask: "List ≥5 candidate pains in that job; stop at ~10 or when the last three are rephrasings. (⚙️ agent drafts from concept + any evidence)"
    type: list
    min: 5
    max: 10
    why: "Fewer than 5 means only the pains already on the team's mind get ranked; past 10 the list grows and the ranking does not."
  - id: score
    ask: "For each pain — severity (how much it hurts) × frequency (how often)?"
    type: per_item
    options: [H, M, L]
  - id: inaction
    ask: "For each pain — what happens if they do nothing about it today?"
    type: per_item
    options: [nice-to-have, recurring irritation, already paying or improvising]
    why: "A pain with no cost of inaction carries no CVP and fails the Step-5 Pain filter — cheaper to learn that now."
  - id: class
    ask: "For each pain — is it a differentiator (where we compete) or table-stakes (must-have, won't win)?"
    type: per_item
    options: [differentiator, table-stakes]
  - id: gain_sought
    ask: "For each top-3 pain — what gain does the segment want past it? One line: 'gain sought: …' (⚙️ agent drafts; uvp-cpv's gain creators read it)"
    type: per_item
    why: "Gain creators at Step 3 need a source; a pain with no gain behind it relieves, never sells."
  - id: lead_pain
    ask: "Which pain do we lead on?"
    type: single_select
    from: pains
    default: null   # ⚙️ agent proposes the top differentiator by severity × frequency
