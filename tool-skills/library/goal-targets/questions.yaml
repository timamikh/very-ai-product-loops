# goal-targets — interview
tool: goal-targets
produces: goal-targets
questions:
  - id: goals
    ask: "List the period goals to set targets for (from {#period-goals}), each with its direction."
    type: list
    why: "This method sets targets for the goals that made the period — it doesn't re-rank them."
  - id: node
    ask: "For each go-to-market goal — which EXISTING metric-tree node (M-…) does it steer? (a missing node is a gap for metric-tree, not a new number here)"
    type: per_item
    why: "A number minted for the goal can't be compared, trended, or trusted."
  - id: baseline
    ask: "For each node — what's the baseline, as a dated reading in metrics.csv? (if it's not in the csv, capture it via metrics-capture first)"
    type: per_item
    why: "A target set against a guessed baseline is a guess squared."
  - id: target
    ask: "For each node — the target for the period, and WHY this size (what the gate needs, what the trend supports, what capacity allows)?"
    type: per_item
    why: "A target with no reasoning is a wish; a miss can't be diagnosed."
  - id: dod
    ask: "For each technical / back-office goal — the binary Definition of Done (answerable yes/no at period end)?"
    type: per_item
    why: "'Improve X' is a direction, not a DoD."
  - id: gate_trace
    ask: "How does each target trace to the period gate — what does hitting it move?"
    type: per_item
    why: "A target that doesn't serve the gate belongs to another period."
