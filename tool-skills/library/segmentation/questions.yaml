# segmentation — interview
# Drives an LLM survey OR renders to a fillable file. ⚙️ = agent-proposed default; free-text always allowed.
tool: segmentation
writes: [section:segments]

questions:
  - id: candidate_cuts
    ask: "Candidate segmentation cuts — ≥3, on different bases (situation · job · behaviour · buying trigger · buyer-vs-user · willingness to pay). One line each: the cut + what it predicts. (⚙️ agent drafts; override freely)"
    type: list
    min: 3
    why: "The volume rule: a cut chosen without named alternatives is the first idea, not a choice — and usually demographic-by-default."
  - id: cut_basis
    ask: "Which cut best predicts different needs for this product?"
    type: single_select
    from: candidate_cuts
    default: null   # ⚙️ agent proposes; override freely
    why: "Actionable cuts beat demographic-by-default; the losing cuts stay recorded as rejects."

  - id: segments
    ask: "Name 1–3 segments on that cut. For each: one-line description + why it matters."
    type: list
    max: 3
    why: "Few, distinct segments early. More is usually false precision."

  - id: buyer_vs_user
    ask: "For each segment — who pays and who uses? ('same' when it's one person; if they differ, name both roles)"
    type: per_item
    why: "Buyer and user have different pains and different channels — a segment where they differ hides two audiences."

  - id: reachability
    ask: "For each segment — where do you find them (a channel, place, community)?"
    type: per_item
    why: "A segment you can't reach is a daydream."

  - id: lead_segment
    ask: "Which segment do you build for first?"
    type: single_select
    from: segments
    default: null   # ⚙️ agent proposes the highest urgency × reachability × moat-fit
    why: "The lead segment leads problems, solution, and value downstream."
