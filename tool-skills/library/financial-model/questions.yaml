# financial-model — interview
tool: financial-model
produces: financial-model
questions:
  - id: cap-policy
    ask: "If a scenario hits your slot/registration caps — do we model raising them (and the capacity/economics cost of that), or treat caps as policy?"
    type: single_select
  - id: stretch-hypothesis
    ask: "Which named hypothesis powers the stretch scenario (e.g. activation fix, new channel)?"
    type: free_text
  - id: divergence-trigger
    ask: "What actual-vs-model divergence (%, months) should force a Step-4 revisit?"
    type: free_text
