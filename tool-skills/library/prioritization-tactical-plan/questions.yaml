# prioritization-tactical-plan — interview
tool: prioritization-tactical-plan
writes: [section:period-goals]
questions:
  - id: gate
    ask: "What's the goal/gate of this period — the metric node to move (M-…) or the Definition of Done every candidate is ranked against?"
    type: free_text
    why: "Candidates are ranked by contribution to the gate, not by an abstract score."
  - id: candidates
    ask: "List every candidate goal current for this period, grouped by direction — none pre-cut; record the count N that entered the ranking."
    type: list
    why: "A pre-cut list hides the ranking's real input; N makes the cut visible."
  - id: capacity
    ask: "What's the available capacity this period (people, budget, time) that bounds the goal set? (from resource-check)"
    type: free_text
    why: "The period's goal set is bounded by capacity, not by wishful scope."
  - id: reach
    ask: "For each candidate — reach: how many users / how much of the base does it touch?"
    type: per_item
  - id: impact
    ask: "For each candidate — impact / contribution: how much does it move the period gate?"
    type: per_item
  - id: confidence
    ask: "For each candidate — confidence: how sure are we of the reach and impact?"
    type: per_item
  - id: effort
    ask: "For each candidate — effort: how much capacity does it consume? (skip for ICE)"
    type: per_item
  - id: moves
    ask: "For each candidate — what does it move or test? (the M-… node or H-… hypothesis)"
    type: per_item
    why: "A goal that moves no metric and tests no hypothesis is a candidate to cut."
