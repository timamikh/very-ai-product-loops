# channels-expansion — interview
tool: channels-expansion
produces: channels-expansion
questions:
  - id: channels
    ask: "Which acquisition/comms channels could reach these segments? ≥8 candidates across ≥3 channel-type categories (⚙️ agent brainstorms the full Bullseye list, not just the obvious ones)"
    type: list
    min: 8
    why: "Fewer than 8 means only the obvious channels entered; the ring sort needs a real field to sort."
  - id: rings
    ask: "Sort each into a ring — inner (test now), middle (promising), outer (unlikely)."
    type: per_item
    options: [inner, middle, outer]
  - id: motion
    ask: "How does this segment buy — which motion carries the sale?"
    type: single_select
    options: [product-led (self-serve), sales-led, partner-led, community-led]
    why: "Price per account must cover the cost of the motion's touch; channels are tested inside a motion."
  - id: test
    ask: "For each inner-ring channel — what metric, cost, and success threshold define the test?"
    type: per_item
    why: "A channel you can't measure isn't a test."
  - id: expansion
    ask: "What's the expansion path — next segments/markets/geographies, and the trigger that unlocks each?"
    type: per_item
    why: "Expansion with no trigger is a wish list."
