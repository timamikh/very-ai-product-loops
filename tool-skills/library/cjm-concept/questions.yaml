# cjm-concept — interview
tool: cjm-concept
produces: cjm
questions:
  - id: segment_job
    ask: "Whose journey is this — which one segment/persona, doing which one job, from what start to what end?"
    type: free_text
    why: "A journey map for 'everyone' maps no one."
  - id: stages
    ask: "What real stages does this customer move through, in THEIR terms? (e.g. aware → evaluate → onboard → habitual use → renew — not your internal funnel)"
    type: list
  - id: per_stage
    ask: "For each stage — actions, touchpoints, thoughts/emotions, and pains. Anchor in interviews/analytics; say how many people the stage rests on; flag guesses."
    type: per_item
    why: "An emotional curve drawn from imagination, unmarked, is theater."
  - id: moments
    ask: "Which are the moments that matter — the make-or-break points where the journey is won or lost?"
    type: free_text
  - id: opportunities
    ask: "Turn each significant pain into an opportunity/bet, and each drop-off into a testable claim ('customers get past stage X'). Which H- does each seed? (Risks are not born at Step 1 — no R- here.)"
    type: per_item
    why: "A CJM that ends with no opportunities changed nothing."
