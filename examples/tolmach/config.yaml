scope_note: >
  Приложение автоматического синхронного перевода устной речи: (а) просмотр иностранных
  фильмов/видео на своём языке в реальном времени и (б) живой разговор людей на разных языках
  почти без задержки, с сохранением голоса и интонации говорящего. Вне скоупа на старте: офлайн
  и собственное железо, B2B-сценарии (колл-центры, конференц-платформы), перевод текста и
  документов. Единственный источник знания о продукте — sources/founder-brief.md.
