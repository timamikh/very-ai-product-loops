# Decksmith (fictional sample) · cycle STATE
#
# Written by the AGENT every pass (see process/OPERATING-LOOP.md, steps 0 and 7). This is the home of
# the cycle's POSITION and gate ticks — distinct from config.yaml, which the HUMAN authors and rarely
# changes. Never put rules or product truth here; state only. Keeping the frequent automatic write out
# of config.yaml means the agent can never clobber the human's decisions.

current_step: 6            # the concept-viability walkthrough has run 1 → 6 (this is a completed sample cycle)
last_pass: 2026-07-21

# Gate ticks — key = the gate item's `artifact#section` target (see each step README's gate checklist);
# where an item spans/repeats sections it carries an explicit tick-id (e.g. step 6 `item-format`).
# Values: done · open · n/a (not applicable) · deferred (intentionally postponed for this status).
# At concept-viability the data-dependent Step-4 quantitatives are deferred by design (no product in
# market yet — see config.yaml scope_note).
