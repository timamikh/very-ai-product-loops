<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>very-ai-product-loops · console</title>
<link rel="stylesheet" href="/app/app.css">
</head>
<body>
<!-- Chrome is English, like every other framework file; the *content* stays in the instance's own
     language, because it is read from the instance. All UI strings live in one STR object in app.js
     so a locale can be added by translating that object.
     This same file is the shell of the exported snapshot: serve.py inlines app.css, app.js and the
     frozen model into one HTML file, so a shared page renders through exactly one renderer. -->
<div id="snap"></div>

<header class="top">
  <div class="brand">
    <div class="mark">loops</div>
    <div class="who">
      <h1 id="product">…</h1>
      <div class="sub" id="subline"></div>
    </div>
  </div>
  <div class="acts" id="acts"></div>
</header>

<!-- The rail and the tabs are the navigation; they stay pinned to the top so a long artifact can be
     read without scrolling back up to change step or tab. -->
<div class="navwrap">
  <nav class="rail" id="rail" aria-label="steps"></nav>
  <nav class="tabs" id="tabs"></nav>
</div>

<main id="view"><div class="loading">reading the product folder…</div></main>

<footer class="foot">
  <span id="footpath"></span>
  <span class="dot">·</span>
  <span id="footrev">read-only — the console never writes to the instance</span>
</footer>

<script src="/app/app.js"></script>
</body>
</html>
